[project]
name = "locomo"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.38.0",
    "bert-score>=0.3.13",
    "datasets>=4.1.1",
    "diskcache>=5.6.3",
    "evaluate>=0.4.6",
    "google-generativeai>=0.8.5",
    "langchain>=0.3.27",
    "langchain-community>=0.3.30",
    "langchain-openai>=0.3.35",
    "langgraph>=0.6.7",
    "langgraph-sdk>=0.2.9",
    "numpy>=2.1.0",
    "openai>=1.109.1",
    "rouge>=1.0.1",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.7.2",
    "sentencepiece>=0.2.1",
    "tiktoken>=0.11.0",
    "torch>=2.8.0",
    "tqdm>=4.67.1",
    "transformers>=4.56.2",
]
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
